
name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-test-build:
    name: Validate, Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cicd-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-profile-build
          path: cicd-demo/dist/
